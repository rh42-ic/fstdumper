name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: almalinux:8
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: dnf install -y gcc gcc-c++ make zlib-devel git curl

      - name: Build
        run: |
          make fstdumper.so
          make fstdumper.so.vpi

      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_Linux_x86_64.tar.gz
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          install -m 0755 /tmp/nfpm /usr/local/bin/nfpm

      - name: Package deb and rpm
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          nfpm package -f nfpm.yaml -p deb -t dist
          nfpm package -f nfpm.yaml -p rpm -t dist
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE=""
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*|*-test*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes $PRERELEASE
